<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>3D Cube Laboratory</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #05070d;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
    touch-action: none;
}

/* Main laboratory */
#lab {
    width: 100vw;
    height: 100vh;
    position: relative;
    overflow: hidden;
}

/* 3D space */
#space {
    position: absolute;
    inset: 0;
    perspective: 900px;
    overflow: hidden;
}

/* Grid floor */
#grid {
    position: absolute;
    width: 200%;
    height: 200%;
    left: -50%;
    top: 55%;
    background-image:
        linear-gradient(rgba(0,220,255,.12) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,220,255,.12) 1px, transparent 1px);
    background-size: 50px 50px;
    transform:
        rotateX(70deg)
        translateZ(-200px);
}

/* 3D world */
#world {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 0;
    height: 0;
    transform-style: preserve-3d;
}

/* Cube */
#cube {
    width: 180px;
    height: 180px;
    position: absolute;
    left: -90px;
    top: -90px;
    transform-style: preserve-3d;
}

/* Cube faces */
.face {
    position: absolute;
    width: 180px;
    height: 180px;

    border: 2px solid rgba(255,255,255,.8);

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 25px;
    font-weight: bold;

    backface-visibility: visible;

    box-shadow:
        inset 0 0 30px rgba(0,220,255,.15),
        0 0 15px rgba(0,220,255,.12);
}

/* Six faces */
.front {
    transform: translateZ(90px);
    background: rgba(0, 180, 255, .28);
}

.back {
    transform: rotateY(180deg) translateZ(90px);
    background: rgba(150, 70, 255, .25);
}

.right {
    transform: rotateY(90deg) translateZ(90px);
    background: rgba(0, 255, 170, .25);
}

.left {
    transform: rotateY(-90deg) translateZ(90px);
    background: rgba(255, 170, 0, .25);
}

.top {
    transform: rotateX(90deg) translateZ(90px);
    background: rgba(255, 80, 180, .25);
}

.bottom {
    transform: rotateX(-90deg) translateZ(90px);
    background: rgba(255, 255, 255, .15);
}

/* Header */
#header {
    position: absolute;
    top: 15px;
    left: 15px;
    z-index: 20;
}

#header h1 {
    font-size: 20px;
}

#header p {
    color: #8b9bb4;
    font-size: 12px;
    margin-top: 4px;
}

/* Controls */
#controls {
    position: absolute;
    bottom: 15px;
    left: 50%;
    transform: translateX(-50%);

    z-index: 20;

    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;

    width: 95%;
}

button {
    background: rgba(10,20,35,.85);
    color: white;

    border: 1px solid #1c91ad;
    border-radius: 8px;

    padding: 10px 14px;

    font-size: 13px;

    backdrop-filter: blur(8px);
}

button:active {
    transform: scale(.95);
}

/* Information panel */
#info {
    position: absolute;
    right: 15px;
    top: 15px;

    z-index: 20;

    background: rgba(5,10,20,.75);
    border: 1px solid #1c91ad;

    border-radius: 10px;

    padding: 12px;

    font-size: 12px;

    min-width: 150px;

    backdrop-filter: blur(8px);
}

.value {
    color: #00d9ff;
}

/* Start screen */
#startScreen {
    position: absolute;
    inset: 0;

    z-index: 100;

    background:
        radial-gradient(circle at center,
        rgba(0,200,255,.12),
        #05070d 60%);

    display: flex;
    align-items: center;
    justify-content: center;

    flex-direction: column;

    text-align: center;
}

#startScreen h1 {
    font-size: 32px;
    margin-bottom: 10px;
}

#startScreen p {
    color: #9caac0;
    margin-bottom: 25px;
    max-width: 400px;
    padding: 0 20px;
}

#startButton {
    font-size: 16px;
    padding: 14px 30px;
    border-color: #00d9ff;
}

/* Hide UI initially */
.hidden {
    display: none !important;
}
</style>
</head>

<body>

<div id="lab">

    <!-- START SCREEN -->
    <div id="startScreen">

        <h1>3D CUBE LABORATORY</h1>

        <p>
            Explore a cube inside a virtual 3D space.
            Drag to rotate, pinch or use the buttons to control it.
        </p>

        <button id="startButton">
            START LABORATORY
        </button>

    </div>


    <!-- MAIN 3D SPACE -->
    <div id="space">

        <div id="grid"></div>

        <div id="world">

            <div id="cube">

                <div class="face front">FRONT</div>
                <div class="face back">BACK</div>
                <div class="face right">RIGHT</div>
                <div class="face left">LEFT</div>
                <div class="face top">TOP</div>
                <div class="face bottom">BOTTOM</div>

            </div>

        </div>

    </div>


    <!-- HEADER -->
    <div id="header" class="hidden">

        <h1>3D CUBE LAB</h1>

        <p>Interactive 3D Environment</p>

    </div>


    <!-- INFORMATION -->
    <div id="info" class="hidden">

        <div>ROT X: <span id="rx" class="value">0°</span></div>
        <div>ROT Y: <span id="ry" class="value">0°</span></div>
        <div>ROT Z: <span id="rz" class="value">0°</span></div>
        <div>ZOOM: <span id="zoomText" class="value">1.0x</span></div>

    </div>


    <!-- CONTROLS -->
    <div id="controls" class="hidden">

        <button onclick="rotateCube(-10,0,0)">▲</button>
        <button onclick="rotateCube(10,0,0)">▼</button>

        <button onclick="rotateCube(0,-10,0)">◀</button>
        <button onclick="rotateCube(0,10,0)">▶</button>

        <button onclick="rotateCube(0,0,-10)">⟲</button>
        <button onclick="rotateCube(0,0,10)">⟳</button>

        <button onclick="resetCube()">RESET</button>

        <button onclick="zoomCube(0.1)">＋</button>
        <button onclick="zoomCube(-0.1)">−</button>

    </div>

</div>


<script>

const cube = document.getElementById("cube");

let rotX = -20;
let rotY = 25;
let rotZ = 0;

let zoom = 1;


/* --------------------------------
   UPDATE CUBE
-------------------------------- */

function updateCube() {

    cube.style.transform =
        `scale3d(${zoom}, ${zoom}, ${zoom})
         rotateX(${rotX}deg)
         rotateY(${rotY}deg)
         rotateZ(${rotZ}deg)`;

    document.getElementById("rx").textContent =
        Math.round(rotX) + "°";

    document.getElementById("ry").textContent =
        Math.round(rotY) + "°";

    document.getElementById("rz").textContent =
        Math.round(rotZ) + "°";

    document.getElementById("zoomText").textContent =
        zoom.toFixed(1) + "x";
}


/* --------------------------------
   ROTATION
-------------------------------- */

function rotateCube(x, y, z) {

    rotX += x;
    rotY += y;
    rotZ += z;

    updateCube();
}


/* --------------------------------
   ZOOM
-------------------------------- */

function zoomCube(amount) {

    zoom += amount;

    zoom = Math.max(.4, Math.min(2.5, zoom));

    updateCube();
}


/* --------------------------------
   RESET
-------------------------------- */

function resetCube() {

    rotX = -20;
    rotY = 25;
    rotZ = 0;

    zoom = 1;

    updateCube();
}


/* --------------------------------
   START LAB
-------------------------------- */

document.getElementById("startButton")
.addEventListener("click", () => {

    document.getElementById("startScreen")
        .classList.add("hidden");

    document.getElementById("header")
        .classList.remove("hidden");

    document.getElementById("info")
        .classList.remove("hidden");

    document.getElementById("controls")
        .classList.remove("hidden");

    updateCube();

});


/* --------------------------------
   TOUCH / MOUSE DRAG
-------------------------------- */

let dragging = false;

let lastX = 0;
let lastY = 0;


/* Mouse */

document.addEventListener("mousedown", e => {

    dragging = true;

    lastX = e.clientX;
    lastY = e.clientY;

});


document.addEventListener("mousemove", e => {

    if (!dragging) return;

    const dx = e.clientX - lastX;
    const dy = e.clientY - lastY;

    rotY += dx * .5;
    rotX -= dy * .5;

    lastX = e.clientX;
    lastY = e.clientY;

    updateCube();

});


document.addEventListener("mouseup", () => {

    dragging = false;

});


/* Touch */

document.addEventListener("touchstart", e => {

    if (e.touches.length !== 1) return;

    dragging = true;

    lastX = e.touches[0].clientX;
    lastY = e.touches[0].clientY;

}, {passive:false});


document.addEventListener("touchmove", e => {

    if (!dragging || e.touches.length !== 1) return;

    e.preventDefault();

    const x = e.touches[0].clientX;
    const y = e.touches[0].clientY;

    const dx = x - lastX;
    const dy = y - lastY;

    rotY += dx * .5;
    rotX -= dy * .5;

    lastX = x;
    lastY = y;

    updateCube();

}, {passive:false});


document.addEventListener("touchend", () => {

    dragging = false;

});


/* --------------------------------
   MOUSE WHEEL ZOOM
-------------------------------- */

document.addEventListener("wheel", e => {

    zoomCube(e.deltaY > 0 ? -.1 : .1);

});


/* Initial */
updateCube();

</script>

</body>
</html>
