<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>3D Geometry Lab</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#05070d;
    color:white;
}

#app{
    width:100%;
    height:100%;
    position:relative;
    overflow:hidden;
}

/* ================= 3D CANVAS ================= */

#scene{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
}

/* ================= TOP BAR ================= */

.topbar{
    position:absolute;
    top:12px;
    left:12px;
    right:12px;
    height:56px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 18px;

    background:rgba(8,12,22,.78);
    border:1px solid rgba(255,255,255,.12);
    border-radius:16px;

    backdrop-filter:blur(14px);
    z-index:5;
}

.logo{
    font-weight:900;
    letter-spacing:1px;
    font-size:18px;
}

.logo span{
    color:#55d8ff;
}

.status{
    color:#7f91a8;
    font-size:11px;
}

/* ================= CONTROL PANEL ================= */

.panel{
    position:absolute;

    left:12px;
    top:80px;
    bottom:12px;

    width:250px;

    padding:17px;

    background:rgba(8,12,22,.82);
    border:1px solid rgba(255,255,255,.1);
    border-radius:18px;

    backdrop-filter:blur(16px);

    overflow-y:auto;
    z-index:5;
}

.title{
    font-size:11px;
    color:#7e8da3;
    text-transform:uppercase;
    letter-spacing:1.3px;
    margin-bottom:14px;
}

.control{
    margin-bottom:18px;
}

.control-row{
    display:flex;
    justify-content:space-between;
    margin-bottom:7px;

    font-size:13px;
}

.number{
    color:#55d8ff;
    font-weight:bold;
}

input[type="range"]{
    width:100%;
    accent-color:#55d8ff;
}

hr{
    border:0;
    border-top:1px solid rgba(255,255,255,.08);
    margin:18px 0;
}

/* ================= BUTTONS ================= */

.buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

button{
    min-height:42px;

    border-radius:11px;

    border:1px solid rgba(255,255,255,.12);

    background:rgba(255,255,255,.055);

    color:white;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;
}

button:hover{
    background:rgba(85,216,255,.12);
    border-color:rgba(85,216,255,.45);
}

button.active{
    background:rgba(85,216,255,.18);
    border-color:#55d8ff;
}

/* ================= STATS ================= */

.stats{
    position:absolute;

    right:12px;
    top:80px;

    width:220px;

    z-index:5;
}

.card{
    background:rgba(8,12,22,.82);
    border:1px solid rgba(255,255,255,.1);
    border-radius:14px;

    padding:12px 14px;
    margin-bottom:8px;

    backdrop-filter:blur(14px);
}

.label{
    font-size:9px;
    text-transform:uppercase;
    letter-spacing:1.2px;
    color:#7c8ba0;
}

.value{
    margin-top:4px;
    font-size:21px;
    font-weight:900;
}

.formula{
    margin-top:3px;
    color:#718097;
    font-size:10px;
}

/* ================= HELP ================= */

.help{
    position:absolute;

    bottom:13px;
    left:50%;
    transform:translateX(-50%);

    background:rgba(8,12,22,.75);
    border:1px solid rgba(255,255,255,.1);

    border-radius:999px;

    padding:9px 14px;

    color:#8795a8;
    font-size:10px;

    z-index:5;

    white-space:nowrap;
}

/* ================= MOBILE ================= */

@media(max-width:750px){

    .panel{
        width:190px;
        padding:12px;
    }

    .stats{
        width:165px;
    }

    .value{
        font-size:16px;
    }

    .logo{
        font-size:14px;
    }

    .status{
        display:none;
    }

    .help{
        font-size:9px;
        max-width:90%;
        overflow:hidden;
    }
}

@media(max-width:500px){

    .panel{
        width:170px;
    }

    .stats{
        width:145px;
    }

    .card{
        padding:9px;
    }

    .buttons{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div id="app">

<canvas id="scene"></canvas>

<!-- ================= TOP ================= -->

<div class="topbar">

    <div class="logo">
        3D <span>GEOMETRY LAB</span>
    </div>

    <div class="status">
        INTERACTIVE 3D SPACE
    </div>

</div>


<!-- ================= LEFT CONTROLS ================= -->

<div class="panel">

    <div class="title">
        Dimensions
    </div>

    <div class="control">

        <div class="control-row">
            <span>Length</span>
            <span class="number" id="lValue">5.0</span>
        </div>

        <input
            id="length"
            type="range"
            min="1"
            max="10"
            step="0.1"
            value="5">

    </div>


    <div class="control">

        <div class="control-row">
            <span>Breadth</span>
            <span class="number" id="bValue">4.0</span>
        </div>

        <input
            id="breadth"
            type="range"
            min="1"
            max="10"
            step="0.1"
            value="4">

    </div>


    <div class="control">

        <div class="control-row">
            <span>Height</span>
            <span class="number" id="hValue">3.0</span>
        </div>

        <input
            id="height"
            type="range"
            min="1"
            max="10"
            step="0.1"
            value="3">

    </div>


    <hr>

    <div class="title">
        Visualization
    </div>


    <div class="buttons">

        <button id="wire">
            ◇ Wireframe
        </button>

        <button id="labels">
            📐 Labels
        </button>

        <button id="explode">
            💥 Explode
        </button>

        <button id="grid">
            ⊞ Grid
        </button>

        <button id="spin">
            ⟳ Auto Rotate
        </button>

        <button id="reset">
            ↺ Reset
        </button>

    </div>

</div>


<!-- ================= RIGHT STATS ================= -->

<div class="stats">

    <div class="card">

        <div class="label">
            Length
        </div>

        <div class="value" id="statL">
            5
        </div>

    </div>


    <div class="card">

        <div class="label">
            Breadth
        </div>

        <div class="value" id="statB">
            4
        </div>

    </div>


    <div class="card">

        <div class="label">
            Height
        </div>

        <div class="value" id="statH">
            3
        </div>

    </div>


    <div class="card">

        <div class="label">
            Volume
        </div>

        <div class="value" id="volume">
            60
        </div>

        <div class="formula">
            V = L × B × H
        </div>

    </div>


    <div class="card">

        <div class="label">
            Total Surface Area
        </div>

        <div class="value" id="tsa">
            94
        </div>

        <div class="formula">
            TSA = 2(LB + BH + HL)
        </div>

    </div>


    <div class="card">

        <div class="label">
            CSA / LSA
        </div>

        <div class="value" id="csa">
            54
        </div>

        <div class="formula">
            CSA = 2H(L + B)
        </div>

    </div>

</div>


<div class="help">
    👆 Drag = Rotate &nbsp; • &nbsp; 🤏 Pinch = Zoom &nbsp; • &nbsp; 🖱️ Wheel = Zoom
</div>

</div>


<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

import { OrbitControls } from
"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js";


/* =====================================================
   RENDERER
===================================================== */

const canvas =
document.getElementById("scene");

const renderer =
new THREE.WebGLRenderer({
    canvas:canvas,
    antialias:true
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio,2)
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.outputColorSpace =
THREE.SRGBColorSpace;


/* =====================================================
   SCENE
===================================================== */

const scene =
new THREE.Scene();

scene.background =
new THREE.Color(0x05070d);


/* =====================================================
   CAMERA
===================================================== */

const camera =
new THREE.PerspectiveCamera(
    45,
    window.innerWidth/window.innerHeight,
    0.1,
    1000
);

camera.position.set(
    9,
    7,
    10
);


/* =====================================================
   CONTROLS
===================================================== */

const controls =
new OrbitControls(
    camera,
    renderer.domElement
);

controls.enableDamping = true;
controls.dampingFactor = 0.07;

controls.minDistance = 3;
controls.maxDistance = 30;

controls.target.set(0,0,0);


/* =====================================================
   LIGHTING
===================================================== */

scene.add(
    new THREE.AmbientLight(
        0xffffff,
        1.5
    )
);

const light =
new THREE.DirectionalLight(
    0xffffff,
    3
);

light.position.set(
    8,
    12,
    10
);

scene.add(light);


const blueLight =
new THREE.PointLight(
    0x45d9ff,
    80,
    50
);

blueLight.position.set(
    -7,
    4,
    -8
);

scene.add(blueLight);


/* =====================================================
   GRID
===================================================== */

const grid =
new THREE.GridHelper(
    30,
    30,
    0x29445a,
    0x152331
);

grid.position.y = -4;

scene.add(grid);


/* =====================================================
   CUBE
===================================================== */

let cube;
let edges;

const cubeGroup =
new THREE.Group();

scene.add(cubeGroup);


const material =
new THREE.MeshStandardMaterial({

    color:0x25b9ff,

    metalness:0.15,

    roughness:0.25,

    transparent:true,

    opacity:0.88
});


let L = 5;
let B = 4;
let H = 3;


/* =====================================================
   BUILD
===================================================== */

function buildCube(){

    if(cube){

        cubeGroup.remove(cube);

        cube.geometry.dispose();
    }

    if(edges){

        cubeGroup.remove(edges);

        edges.geometry.dispose();
    }


    const geometry =
    new THREE.BoxGeometry(
        L,
        H,
        B
    );


    cube =
    new THREE.Mesh(
        geometry,
        material
    );


    cubeGroup.add(cube);


    const edgeGeometry =
    new THREE.EdgesGeometry(
        geometry
    );


    edges =
    new THREE.LineSegments(
        edgeGeometry,

        new THREE.LineBasicMaterial({
            color:0xb9f3ff
        })
    );


    cubeGroup.add(edges);
}


/* =====================================================
   LABELS
===================================================== */

const labelGroup =
new THREE.Group();

scene.add(labelGroup);


function makeLabel(text,x,y,z){

    const c =
    document.createElement("canvas");

    c.width = 400;
    c.height = 100;

    const ctx =
    c.getContext("2d");

    ctx.fillStyle =
    "rgba(5,10,18,.92)";

    ctx.beginPath();

    ctx.roundRect(
        5,5,390,90,18
    );

    ctx.fill();

    ctx.fillStyle =
    "white";

    ctx.font =
    "bold 40px Arial";

    ctx.textAlign =
    "center";

    ctx.textBaseline =
    "middle";

    ctx.fillText(
        text,
        200,
        50
    );


    const texture =
    new THREE.CanvasTexture(c);


    const sprite =
    new THREE.Sprite(
        new THREE.SpriteMaterial({
            map:texture,
            transparent:true
        })
    );


    sprite.scale.set(
        2.2,
        .55,
        1
    );


    sprite.position.set(
        x,y,z
    );


    return sprite;
}


function updateLabels(){

    labelGroup.clear();

    labelGroup.add(
        makeLabel(
            "L = "+L.toFixed(1),
            0,
            -H/2-.7,
            B/2+.3
        )
    );


    labelGroup.add(
        makeLabel(
            "B = "+B.toFixed(1),
            L/2+.8,
            -H/2-.7,
            0
        )
    );


    labelGroup.add(
        makeLabel(
            "H = "+H.toFixed(1),
            L/2+.7,
            0,
            B/2
        )
    );
}


/* =====================================================
   MATH
===================================================== */

function updateMath(){

    const volume =
    L*B*H;


    const tsa =
    2*(L*B+B*H+H*L);


    const csa =
    2*H*(L+B);


    document.getElementById(
        "volume"
    ).textContent =
    volume.toFixed(2);


    document.getElementById(
        "tsa"
    ).textContent =
    tsa.toFixed(2);


    document.getElementById(
        "csa"
    ).textContent =
    csa.toFixed(2);


    document.getElementById(
        "statL"
    ).textContent =
    L.toFixed(1);


    document.getElementById(
        "statB"
    ).textContent =
    B.toFixed(1);


    document.getElementById(
        "statH"
    ).textContent =
    H.toFixed(1);
}


/* =====================================================
   SLIDERS
===================================================== */

function update(){

    L =
    Number(
        document.getElementById(
            "length"
        ).value
    );


    B =
    Number(
        document.getElementById(
            "breadth"
        ).value
    );


    H =
    Number(
        document.getElementById(
            "height"
        ).value
    );


    document.getElementById(
        "lValue"
    ).textContent =
    L.toFixed(1);


    document.getElementById(
        "bValue"
    ).textContent =
    B.toFixed(1);


    document.getElementById(
        "hValue"
    ).textContent =
    H.toFixed(1);


    buildCube();
    updateLabels();
    updateMath();
}


document.getElementById(
    "length"
).addEventListener(
    "input",
    update
);


document.getElementById(
    "breadth"
).addEventListener(
    "input",
    update
);


document.getElementById(
    "height"
).addEventListener(
    "input",
    update
);


/* =====================================================
   WIREFRAME
===================================================== */

let wire = false;

document.getElementById(
    "wire"
).addEventListener(
    "click",
    function(){

        wire = !wire;

        material.wireframe = wire;

        this.classList.toggle(
            "active",
            wire
        );
    }
);


/* =====================================================
   LABELS
===================================================== */

let labels = true;

document.getElementById(
    "labels"
).addEventListener(
    "click",
    function(){

        labels = !labels;

        labelGroup.visible =
        labels;

        this.classList.toggle(
            "active",
            labels
        );
    }
);


/* =====================================================
   EXPLODE
===================================================== */

let explode = false;

document.getElementById(
    "explode"
).addEventListener(
    "click",
    function(){

        explode = !explode;

        cubeGroup.position.y =
        explode ? 1.2 : 0;

        cubeGroup.scale.setScalar(
            explode ? 1.1 : 1
        );

        this.classList.toggle(
            "active",
            explode
        );
    }
);


/* =====================================================
   GRID
===================================================== */

let gridVisible = true;

document.getElementById(
    "grid"
).addEventListener(
    "click",
    function(){

        gridVisible =
        !gridVisible;

        grid.visible =
        gridVisible;

        this.classList.toggle(
            "active",
            gridVisible
        );
    }
);


/* =====================================================
   AUTO ROTATION
===================================================== */

let autoRotate = false;

document.getElementById(
    "spin"
).addEventListener(
    "click",
    function(){

        autoRotate =
        !autoRotate;

        this.classList.toggle(
            "active",
            autoRotate
        );
    }
);


/* =====================================================
   RESET
===================================================== */

document.getElementById(
    "reset"
).addEventListener(
    "click",
    function(){

        document.getElementById(
            "length"
        ).value = 5;

        document.getElementById(
            "breadth"
        ).value = 4;

        document.getElementById(
            "height"
        ).value = 3;


        L = 5;
        B = 4;
        H = 3;


        cubeGroup.position.set(
            0,0,0
        );

        cubeGroup.scale.setScalar(1);


        camera.position.set(
            9,
            7,
            10
        );


        controls.target.set(
            0,0,0
        );

        controls.update();


        explode = false;

        document.getElementById(
            "explode"
        ).classList.remove(
            "active"
        );


        update();
    }
);


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    function(){

        camera.aspect =
        window.innerWidth /
        window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);


/* =====================================================
   START
===================================================== */

buildCube();
updateLabels();
updateMath();


/* =====================================================
   ANIMATION
===================================================== */

function animate(){

    requestAnimationFrame(
        animate
    );


    if(autoRotate){

        cubeGroup.rotation.y +=
        0.006;
    }


    controls.update();

    renderer.render(
        scene,
        camera
    );
}


animate();

</script>

</body>
</html>
